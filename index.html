<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML with JS</title>
    <link rel="stylesheet" href="./main.css"/>
</head>
<body>
    <div class="container1">
        <h1>Teste de valores</h1>
        <h2> B > A ?</h2>
        <form id="form-test">
            <label for="test-a">A:</label>
            <input type="number" id="test-a" required placeholder="O número menor">
            <p class="error-message1">
                Valor A precisa ser menor que Valor B.
            </p>
            <label for="test-b" >B:</label>
            <input type="number" id="test-b" required placeholder="O número maior">
            <button id="btn-testar" type="submit">
                Verificar
            </button>
            <p class="success-message1">
            </p>
        </form>
    </div>
    <div class="container">
        <h1>EBAC Banking</h1>
        <h2>Depósitos</h2>
        <form id="form-deposito">
            <input type="text" id="nome-beneficiario" required placeholder="Nome Completo do beneficiário" />
            <p class="error-message">
                O nome precisa ser completo
            </p>
            <input type="number" id="numero-conta" required placeholder="Número da conta" />
            <input type="number" id="valor-deposito" required placeholder="Valor"/>
            <textArea placeholder="Descrição (opcional)" id="descricao"></textArea>
            <button id="btn-depositar" type="submit">Depositar</button>
        </form>
        <p class="success-message">
        </p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
